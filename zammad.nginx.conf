# Zammad site. Installed disabled. Enable with:
#   ln -s ../sites-available/zammad.conf /etc/nginx/sites-enabled/zammad.conf
#   systemctl reload nginx
# server_name is zammad.* so this does not replace the default vhost.
# Put TLS in front of this server if the helpdesk is reachable beyond localhost.

upstream zammad-railsserver {
	server 127.0.0.1:3000;
}

upstream zammad-websocket {
	server 127.0.0.1:6042;
}

server {
	listen 80;
	listen [::]:80;
	server_name zammad.*;
	server_tokens off;

	root /srv/www/zammad/public;

	client_max_body_size 50M;

	# The service worker must not be cached across package updates.
	location = /assets/frontend/vite/sw.js {
		expires off;
		add_header Cache-Control "no-cache";
	}

	location ~ ^/(assets/|robots.txt|humans.txt|favicon.ico|apple-touch-icon.png) {
		expires max;
	}

	location /ws {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header CLIENT_IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Forwarded "";
		proxy_set_header X-Forwarded-Scheme "";
		proxy_set_header X-Forwarded-Ssl "";
		proxy_read_timeout 86400;
		proxy_pass http://zammad-websocket;
	}

	location /cable {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header CLIENT_IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Forwarded "";
		proxy_set_header X-Forwarded-Scheme "";
		proxy_set_header X-Forwarded-Ssl "";
		proxy_read_timeout 86400;
		proxy_pass http://zammad-railsserver;
	}

	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header CLIENT_IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Forwarded "";
		proxy_set_header X-Forwarded-Scheme "";
		proxy_set_header X-Forwarded-Ssl "";
		# Exactly one of these is used for SSO. Leave both cleared otherwise.
		proxy_set_header X-Forwarded-User "";
		proxy_set_header Remote-User "";
		proxy_read_timeout 300;
		proxy_pass http://zammad-railsserver;

		gzip on;
		gzip_types text/plain text/xml text/css image/svg+xml application/javascript application/x-javascript application/json application/xml;
		gzip_proxied any;
	}
}
