# Optional automatic reply for a new customer message.
# Set ENABLED to 1 and set AI_MODEL. The next customer message picks
# this up. A restart is not required.
# The wording is /etc/zammad/ai-reply.template.
# Placeholders: {{response}} {{ticket_number}} {{customer_name}} {{subject}}

ENABLED=0

# Local Ollama. The model has to be pulled already. Other local servers
# that speak Ollama's /api/generate can use the same kind of URL.
AI_BASE_URL=http://127.0.0.1:11434
AI_MODEL=

# A reply is sent only when the model reports at least this confidence
# (0 to 1) that the answer solves the problem. Values above 1 are treated
# as a percentage, so 10 and 0.10 mean the same thing.
CONFIDENCE_MIN=0.10

# Seconds to wait for the model.
TIMEOUT=60

# Protocol is inferred from AI_BASE_URL:
#   http://127.0.0.1:11434       Ollama /api/generate
#   a URL that ends in /v1       OpenAI chat completions
#   https://api.x.ai/v1          SpaceXAI responses API
# Set AI_PROTOCOL to ollama, openai, or xai to force one of those.
AI_PROTOCOL=

# Hosted SpaceXAI can be used instead of a local model:
#   AI_BASE_URL=https://api.x.ai/v1
#   AI_MODEL=grok-4.7
#   AI_API_KEY=...
# Keep the key in this file. It is readable by root and the zammad group.
# zammad.env is world-readable, so do not put the key there.
# If AI_API_KEY is empty, the script uses XAI_API_KEY or AI_API_KEY from
# the worker environment.
AI_API_KEY=
