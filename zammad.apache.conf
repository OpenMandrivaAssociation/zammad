# Zammad virtual host. This file is NOT loaded: Apache includes only
# conf/vhosts.d/*.conf, and a *.conf here would become the default server
# for port 80 if no other VirtualHost exists.
#
# To enable:
#   cp /etc/httpd/conf/vhosts.d/zammad.conf.disabled /etc/httpd/conf/vhosts.d/zammad.conf
#   edit ServerName below
#   systemctl reload httpd-prefork
#
# Put TLS in front of this vhost if the helpdesk is reachable beyond localhost.

<VirtualHost *:80>
	ServerName zammad.localhost
	ServerAlias zammad.*

	HostnameLookups Off
	UseCanonicalName Off
	ServerSignature Off

	ProxyRequests Off
	ProxyPreserveHost On

	<Proxy 127.0.0.1:3000>
		Require all granted
	</Proxy>

	ProxyPass /assets !
	ProxyPass /favicon.ico !
	ProxyPass /apple-touch-icon.png !
	ProxyPass /robots.txt !
	ProxyPass /ws ws://127.0.0.1:6042/
	ProxyPass /cable ws://127.0.0.1:3000/cable
	ProxyPass / http://127.0.0.1:3000/

	RequestHeader set X-Forwarded-Proto "http"
	RequestHeader unset Forwarded
	RequestHeader unset X-Forwarded-Scheme
	RequestHeader unset X-Forwarded-Ssl
	# Exactly one of these is used for SSO. Leave both cleared otherwise.
	RequestHeader unset X-Forwarded-User
	RequestHeader unset Remote-User

	<Location "/assets/frontend/vite/sw.js">
		Header set Cache-Control "no-cache"
	</Location>

	DocumentRoot "/srv/www/zammad/public"

	<Directory "/srv/www/zammad/public">
		Options FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
</VirtualHost>
